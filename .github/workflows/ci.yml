name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: checkout lattice-server
        uses: actions/checkout@v6
        with:
          path: lattice-server
      - uses: actions/setup-go@v6
        with:
          # Pinned while actions/go-versions still lists 1.26.8 as the newest 1.26;
          # 1.26.9 fixes GO-2026-6607 to 6617 (net/http, net/textproto, crypto/tls),
          # which govulncheck now reports. setup-go downloads it from go.dev.
          go-version: '1.26.9'
          check-latest: true
          cache-dependency-path: |
            lattice-server/go.mod
            lattice-server/go.sum
      - name: gofmt
        working-directory: lattice-server
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: docker defaults contract
        working-directory: lattice-server
        run: sh scripts/check-docker-defaults.sh
      - name: vet
        working-directory: lattice-server
        run: go vet ./...
      - name: test
        working-directory: lattice-server
        shell: bash
        # internal/server runs in the server job below; every other package
        # runs here. shell: bash sets pipefail, so a failing go list fails
        # the step.
        run: go list ./... | grep -v '/internal/server$' | xargs go test -race -cover -timeout 25m
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./lattice-server/...
      - name: govulncheck
        working-directory: lattice-server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
  server:
    # internal/server is one test binary of about 1400 serial tests that took
    # 1437 s under -race -cover on a shared runner, against go test's 25m
    # timeout. Each shard runs every Nth top-level test (subtests follow their
    # parent), so together the shards run every test exactly once. To add a
    # shard, add an entry to the matrix; the split reads the count from it.
    name: server (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: checkout lattice-server
        uses: actions/checkout@v6
        with:
          path: lattice-server
      - uses: actions/setup-go@v6
        with:
          # Pinned while actions/go-versions still lists 1.26.8 as the newest 1.26;
          # 1.26.9 fixes GO-2026-6607 to 6617 (net/http, net/textproto, crypto/tls),
          # which govulncheck now reports. setup-go downloads it from go.dev.
          go-version: '1.26.9'
          check-latest: true
          cache-dependency-path: |
            lattice-server/go.mod
            lattice-server/go.sum
      - name: test internal/server
        working-directory: lattice-server
        shell: bash
        env:
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
        # The listing builds with the same flags as the run, so the run reuses
        # the build. The coverage it prints is the share of internal/server
        # statements this shard's tests reach.
        run: |
          tests=$(go test -race -cover -list . ./internal/server/ | grep -E '^(Test|Example|Fuzz)' | awk -v n="$SHARDS" -v i="$SHARD" '(NR - 1) % n == i' | paste -sd '|' -)
          test -n "$tests"
          echo "shard $((SHARD + 1)) of $SHARDS runs $(echo "$tests" | tr '|' '\n' | wc -l) top-level tests"
          go test -race -cover -timeout 25m -run "^($tests)\$" ./internal/server/
  substore-e2e:
    # Design 28 S2's end-to-end tests over the real Sub-Store plugin
    # (internal/server/substore_s2_e2e_test.go): the plugin is checked out at
    # the commit internal/server/testdata/substore-plugin.ref records, built
    # by the tests and run under the real system runner. They fail, not
    # skip, when the checkout is missing here (five acceptance items live
    # only in them); the server shards above skip them.
    name: substore e2e
    runs-on: ubuntu-latest
    steps:
      - name: checkout lattice-server
        uses: actions/checkout@v6
        with:
          path: lattice-server
      - name: read the plugin pin
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < lattice-server/internal/server/testdata/substore-plugin.ref)" >> "$GITHUB_OUTPUT"
      - name: checkout lattice-plugin-sub-store at the pin
        uses: actions/checkout@v6
        with:
          repository: LatticeNet/lattice-plugin-sub-store
          ref: ${{ steps.pin.outputs.ref }}
          path: lattice-plugin-sub-store
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          check-latest: true
          cache-dependency-path: |
            lattice-server/go.mod
            lattice-server/go.sum
            lattice-plugin-sub-store/system-go/go.sum
      - name: test the S2 end-to-end flow over the real plugin
        working-directory: lattice-server
        env:
          LATTICE_SUBSTORE_PLUGIN_REQUIRED: "1"
          LATTICE_SUBSTORE_PLUGIN_DIR: ${{ github.workspace }}/lattice-plugin-sub-store
        run: >-
          go test -race -count=1 -timeout 30m -v
          -run '^(TestTwoIdentitiesTwoCredentialsOneCachedPlan|TestPluginPlanFixturesPassBindCheckNode|TestS2FleetRenderLatency1000|TestScriptOperatorForeignServerIsPlanRejected|TestZeroRowFleetShareAnswersDecoy|TestStagedRevisionServesOnlyAfterApproval|TestClearOnlyPlanProposedThroughGateway|TestLegacyShareFirstRequestServes|TestCoreReadsRecordDocumentAtPluginKey|TestFleetWriteExpiresOnlyDependents|TestFleetWriteExpiry|TestMigrationThenFailedRefetchServesNoLegacyEntry|TestPlansProposeRestAfterPartialMigration|TestPlansCollectionDiffShowsSwitchedMemberAsProviderContent|TestPlanDeleteApplyRendersTagDependentCollection|TestFleetSnapshotIsKeyedOnTheHashOfRaw|TestFleetWriteExpiresARecordEditedSinceTheAnswer|TestChainOnlyRevisionShowsInThePlan|TestScriptNetworkRefusalNamesTheStep)$'
          ./internal/server/
  perf:
    # Wall-clock figures for S2 (plan section 5) on a fixed runner image,
    # never in the jobs above: core's bind of a 1000-node plan (under 50 ms,
    # judged by the plugin's tools/perfgate with -target), the propose
    # benchmark with 20 identities (recorded), and the fleet-bound share's
    # cache miss at 1000 lines over the real plugin (under 400 ms).
    runs-on: ubuntu-24.04
    steps:
      - name: checkout lattice-server
        uses: actions/checkout@v6
        with:
          path: lattice-server
      - name: read the plugin pin
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < lattice-server/internal/server/testdata/substore-plugin.ref)" >> "$GITHUB_OUTPUT"
      - name: checkout lattice-plugin-sub-store at the pin
        uses: actions/checkout@v6
        with:
          repository: LatticeNet/lattice-plugin-sub-store
          ref: ${{ steps.pin.outputs.ref }}
          path: lattice-plugin-sub-store
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          check-latest: true
          cache-dependency-path: |
            lattice-server/go.mod
            lattice-server/go.sum
            lattice-plugin-sub-store/system-go/go.sum
            lattice-plugin-sub-store/tools/perfgate/go.mod
      - name: run the bind and propose benchmarks ten times
        working-directory: lattice-server
        shell: bash
        run: >-
          go test -run '^$' -bench '^(BenchmarkSubstoreBindPlan1000|BenchmarkSubstoreBindPlanWithCatalogueBuild1000|BenchmarkPlansPropose20Identities)$'
          -count 10 -benchmem -timeout 30m ./internal/server/ | tee "$RUNNER_TEMP/bench.txt"
      - name: judge the bind gate
        working-directory: lattice-plugin-sub-store/tools/perfgate
        run: go run . -target BenchmarkSubstoreBindPlan1000=50ms -current "$RUNNER_TEMP/bench.txt"
      - name: fleet-bound cache miss at 1000 lines
        working-directory: lattice-server
        shell: bash
        env:
          LATTICE_SUBSTORE_PLUGIN_REQUIRED: "1"
          LATTICE_SUBSTORE_PLUGIN_DIR: ${{ github.workspace }}/lattice-plugin-sub-store
          LATTICE_SUBSTORE_PERF_GATE: "1"
        run: go test -count=1 -v -run '^TestS2FleetRenderLatency1000$' ./internal/server/ | tee "$RUNNER_TEMP/latency.txt"
      - name: keep the figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-perf-ubuntu-24.04
          path: |
            ${{ runner.temp }}/bench.txt
            ${{ runner.temp }}/latency.txt
          retention-days: 30
