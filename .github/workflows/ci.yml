name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: checkout lattice-server
        uses: actions/checkout@v6
        with:
          path: lattice-server
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: |
            lattice-server/go.mod
            lattice-server/go.sum
      - name: gofmt
        working-directory: lattice-server
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: docker defaults contract
        working-directory: lattice-server
        run: sh scripts/check-docker-defaults.sh
      - name: vet
        working-directory: lattice-server
        run: go vet ./...
      - name: test
        working-directory: lattice-server
        # The E5 line-chain and subscription suites push internal/server past
        # go test's 10m default under -race -cover on shared runners; the run
        # died as an aggregate timeout with the active test at 0s, not a hang.
        run: go test -race -cover -timeout 25m ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./lattice-server/...
      - name: govulncheck
        working-directory: lattice-server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
